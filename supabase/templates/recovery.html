<h2>Redefinir palavra-passe</h2>
<p>Recebemos um pedido para redefinir a palavra-passe da sua conta.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
  >
    Definir nova palavra-passe
  </a>
</p>
<p>Se não fez este pedido, pode ignorar este email. A ligação expira automaticamente.</p>
<hr />
<p lang="en">
  Reset your password:
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
    >set a new password</a
  >. If you did not request this, you can ignore this email.
</p>
